java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q NajmulWiFiMonitor-Android-Source.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/NajmulWiFiMonitor
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Najmul-WiFi
